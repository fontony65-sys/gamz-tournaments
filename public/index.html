<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gamz — tournaments & leaderboards</title>
<meta name="description" content="gamz mobile gaming community: eFootball, DLS, PUBG Mobile, Call of Duty: Mobile and Free Fire tournaments, live brackets and leaderboards.">
<meta name="theme-color" content="#07060d">
<meta name="color-scheme" content="dark light">
<script>
/* Runs before first paint: pick the theme (saved choice > system preference > dark) so there is no flash. */
(function () {
  var t = null; try { t = localStorage.getItem('gamz-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', t === 'light' ? '#f6f4fe' : '#07060d');
})();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="gamz">

  </nav>
